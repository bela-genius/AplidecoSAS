{% extends "base.html" %}
{% block title %}Checkout · {{ site_settings.site_name }}{% endblock %}
{% block content %}
<section class="px-6 sm:px-10 py-16 max-w-2xl">
    <h1 class="font-display text-detonate text-bone text-[12vw] sm:text-6xl mb-10" data-aos="fade-up">Finalizar compra</h1>
    <form method="post" class="space-y-4" data-aos="fade-up">
        {% csrf_token %}
        <input name="full_name" required placeholder="Nombre completo">
        <input type="email" name="email" required placeholder="Correo electrónico">
        <input name="phone" placeholder="Teléfono">
        <input name="shipping_address" required placeholder="Dirección de envío">
        <input name="city" placeholder="Ciudad">
        <textarea name="notes" placeholder="Notas adicionales" rows="3"></textarea>
        <div class="flex items-center justify-between pt-4">
            <span class="font-display text-detonate text-2xl text-bone">Total: ${{ cart.total }}</span>
            <button class="pill pill-active">Confirmar pedido</button>
        </div>
    </form>
</section>
{% endblock %}
