{% extends "base.html" %}
{% block title %}Checkout · {{ site_settings.site_name }}{% endblock %}
{% block content %}
<section class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
    <h1 class="text-3xl font-extrabold mb-10" data-aos="fade-up">Finalizar compra</h1>
    <form method="post" class="space-y-4" data-aos="fade-up">
        {% csrf_token %}
        <input name="full_name" required placeholder="Nombre completo" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3">
        <input type="email" name="email" required placeholder="Correo electrónico" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3">
        <input name="phone" placeholder="Teléfono" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3">
        <input name="shipping_address" required placeholder="Dirección de envío" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3">
        <input name="city" placeholder="Ciudad" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3">
        <textarea name="notes" placeholder="Notas adicionales" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3"></textarea>
        <div class="flex items-center justify-between pt-4">
            <span class="text-xl font-bold">Total: ${{ cart.total }}</span>
            <button class="brand-gradient px-8 py-3 rounded-full font-semibold hover:scale-105 transition">Confirmar pedido</button>
        </div>
    </form>
</section>
{% endblock %}
