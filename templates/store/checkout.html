{% extends "base.html" %}
{% block title %}Checkout · {{ site_settings.site_name }}{% endblock %}
{% block content %}
<section class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
    <h1 class="font-display text-3xl text-carbon mb-10" data-aos="fade-up">Finalizar compra</h1>
    <form method="post" class="space-y-4" data-aos="fade-up">
        {% csrf_token %}
        <input name="full_name" required placeholder="Nombre completo" class="w-full bg-white border border-carbon-700/20 rounded-md px-4 py-3 text-carbon placeholder:text-carbon-500 focus:outline-none focus:border-rojo">
        <input type="email" name="email" required placeholder="Correo electrónico" class="w-full bg-white border border-carbon-700/20 rounded-md px-4 py-3 text-carbon placeholder:text-carbon-500 focus:outline-none focus:border-rojo">
        <input name="phone" placeholder="Teléfono" class="w-full bg-white border border-carbon-700/20 rounded-md px-4 py-3 text-carbon placeholder:text-carbon-500 focus:outline-none focus:border-rojo">
        <input name="shipping_address" required placeholder="Dirección de envío" class="w-full bg-white border border-carbon-700/20 rounded-md px-4 py-3 text-carbon placeholder:text-carbon-500 focus:outline-none focus:border-rojo">
        <input name="city" placeholder="Ciudad" class="w-full bg-white border border-carbon-700/20 rounded-md px-4 py-3 text-carbon placeholder:text-carbon-500 focus:outline-none focus:border-rojo">
        <textarea name="notes" placeholder="Notas adicionales" rows="3" class="w-full bg-white border border-carbon-700/20 rounded-md px-4 py-3 text-carbon placeholder:text-carbon-500 focus:outline-none focus:border-rojo"></textarea>
        <div class="flex items-center justify-between pt-4">
            <span class="font-display text-xl text-carbon">Total: ${{ cart.total }}</span>
            <button class="bg-rojo hover:bg-rojo-700 text-white font-semibold px-8 py-3 rounded-md transition-colors">Confirmar pedido</button>
        </div>
    </form>
</section>
{% endblock %}
