{% extends "base.html" %}
{% block title %}Checkout · {{ site_settings.site_name }}{% endblock %}
{% block content %}
<section class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
    <h1 class="font-display font-bold text-3xl text-white mb-10" data-aos="fade-up">Finalizar compra</h1>
    <form method="post" class="space-y-4" data-aos="fade-up">
        {% csrf_token %}
        <input name="full_name" required placeholder="Nombre completo" class="w-full bg-graphite-800 border border-graphite-600 rounded-md px-4 py-3 text-white placeholder:text-graphite-500 focus:outline-none focus:border-accent">
        <input type="email" name="email" required placeholder="Correo electrónico" class="w-full bg-graphite-800 border border-graphite-600 rounded-md px-4 py-3 text-white placeholder:text-graphite-500 focus:outline-none focus:border-accent">
        <input name="phone" placeholder="Teléfono" class="w-full bg-graphite-800 border border-graphite-600 rounded-md px-4 py-3 text-white placeholder:text-graphite-500 focus:outline-none focus:border-accent">
        <input name="shipping_address" required placeholder="Dirección de envío" class="w-full bg-graphite-800 border border-graphite-600 rounded-md px-4 py-3 text-white placeholder:text-graphite-500 focus:outline-none focus:border-accent">
        <input name="city" placeholder="Ciudad" class="w-full bg-graphite-800 border border-graphite-600 rounded-md px-4 py-3 text-white placeholder:text-graphite-500 focus:outline-none focus:border-accent">
        <textarea name="notes" placeholder="Notas adicionales" rows="3" class="w-full bg-graphite-800 border border-graphite-600 rounded-md px-4 py-3 text-white placeholder:text-graphite-500 focus:outline-none focus:border-accent"></textarea>
        <div class="flex items-center justify-between pt-4">
            <span class="font-display font-bold text-xl text-white">Total: ${{ cart.total }}</span>
            <button class="bg-accent hover:bg-accent-dark text-white font-semibold px-8 py-3 rounded-md transition-colors">Confirmar pedido</button>
        </div>
    </form>
</section>
{% endblock %}
