{% extends "base.html" %}
{% block title %}{{ page.title }} · {{ site_settings.site_name }}{% endblock %}
{% block content %}
<section class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-16" data-aos="fade-up">
    {% if page.hero_image %}
        <img src="{{ page.hero_image.url }}" alt="{{ page.title }}" class="w-full rounded-2xl mb-8">
    {% endif %}
    <h1 class="text-3xl font-extrabold mb-2">{{ page.title }}</h1>
    {% if page.subtitle %}<p class="text-slate-400 mb-8">{{ page.subtitle }}</p>{% endif %}
    <div class="prose prose-invert max-w-none">{{ page.body|linebreaks }}</div>
</section>
{% endblock %}
