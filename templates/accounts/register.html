{% extends "base.html" %}
{% block title %}Crear cuenta · {{ site_settings.site_name }}{% endblock %}
{% block content %}
<section class="px-6 sm:px-10 py-24 max-w-md mx-auto" data-aos="fade-up">
    <h1 class="font-display text-detonate text-bone text-5xl mb-10 text-center">Crear cuenta</h1>
    <form method="post" class="space-y-4">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="pill pill-active w-full justify-center">Registrarme</button>
    </form>
    <p class="text-center text-ash mt-6">¿Ya tienes cuenta? <a href="{% url 'accounts:login' %}" class="text-alarm hover:underline">Ingresa aquí</a></p>
</section>
{% endblock %}
