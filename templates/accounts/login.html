{% extends "base.html" %}
{% block title %}Ingresar · {{ site_settings.site_name }}{% endblock %}
{% block content %}
<section class="px-6 sm:px-10 py-24 max-w-md mx-auto" data-aos="fade-up">
    <h1 class="font-display text-detonate text-bone text-5xl mb-10 text-center">Ingresar</h1>
    <form method="post" class="space-y-4">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="pill pill-active w-full justify-center">Entrar</button>
    </form>
    <p class="text-center text-ash mt-6">¿No tienes cuenta? <a href="{% url 'accounts:register' %}" class="text-alarm hover:underline">Regístrate</a></p>
</section>
{% endblock %}
